<svg width="100%" viewBox="0 0 680 580" role="img" xmlns="http://www.w3.org/2000/svg">
<title>LLM Eval Dashboard — system architecture</title>
<desc>Eval pipeline: golden dataset feeds RAGAS runner, scores post to FastAPI, stored in PostgreSQL, drift detection triggers alerts, Grafana polls for live dashboard.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1a1a1a; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; fill: #555; }
    .arr { stroke: #888; stroke-width: 1; fill: none; }
    .box-blue   { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
    .box-teal   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .box-amber  { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
    .box-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .box-green  { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.5; }
    .box-gray   { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
    .box-red    { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 0.5; }
    .txt-blue   { fill: #0C447C; }
    .txt-teal   { fill: #085041; }
    .txt-amber  { fill: #633806; }
    .txt-purple { fill: #3C3489; }
    .txt-green  { fill: #27500A; }
    .txt-gray   { fill: #444441; }
    .txt-red    { fill: #791F1F; }
    .sub { font-size: 12px; }
    .sub-blue   { fill: #185FA5; }
    .sub-teal   { fill: #0F6E56; }
    .sub-amber  { fill: #854F0B; }
    .sub-purple { fill: #534AB7; }
    .sub-green  { fill: #3B6D11; }
    .sub-gray   { fill: #5F5E5A; }
    .sub-red    { fill: #A32D2D; }
  </style>
</defs>

<!-- Row 0: Trigger sources -->
<rect x="130" y="30" width="140" height="44" rx="8" class="box-gray"/>
<text class="th txt-gray" x="200" y="52" text-anchor="middle">CI/CD pipeline</text>
<text class="sub sub-gray" x="200" y="68" text-anchor="middle">triggers on each deploy</text>

<rect x="410" y="30" width="140" height="44" rx="8" class="box-gray"/>
<text class="th txt-gray" x="480" y="52" text-anchor="middle">Manual run</text>
<text class="sub sub-gray" x="480" y="68" text-anchor="middle">python run_eval.py</text>

<line x1="200" y1="74" x2="200" y2="104" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="74" x2="480" y2="104" class="arr" marker-end="url(#arrow)"/>
<line x1="200" y1="104" x2="480" y2="104" class="arr"/>
<line x1="340" y1="104" x2="340" y2="120" class="arr" marker-end="url(#arrow)"/>

<!-- Row 1: RAGAS runner -->
<rect x="190" y="120" width="300" height="56" rx="8" class="box-amber"/>
<text class="th txt-amber" x="340" y="143" text-anchor="middle">RAGAS evaluation runner</text>
<text class="sub sub-amber" x="340" y="161" text-anchor="middle">faithfulness · answer relevance · context precision</text>

<!-- golden dataset feed from left -->
<rect x="20" y="134" width="120" height="44" rx="8" class="box-gray"/>
<text class="th txt-gray" x="80" y="153" text-anchor="middle">Golden dataset</text>
<text class="sub sub-gray" x="80" y="169" text-anchor="middle">10 curated Q&amp;As</text>
<line x1="140" y1="156" x2="188" y2="156" class="arr" marker-end="url(#arrow)"/>

<!-- langsmith trace to right -->
<rect x="544" y="134" width="116" height="44" rx="8" class="box-purple"/>
<text class="th txt-purple" x="602" y="153" text-anchor="middle">LangSmith</text>
<text class="sub sub-purple" x="602" y="169" text-anchor="middle">full trace capture</text>
<line x1="490" y1="156" x2="542" y2="156" class="arr" marker-end="url(#arrow)"/>

<line x1="340" y1="176" x2="340" y2="206" class="arr" marker-end="url(#arrow)"/>

<!-- Row 2: FastAPI -->
<rect x="190" y="206" width="300" height="56" rx="8" class="box-blue"/>
<text class="th txt-blue" x="340" y="229" text-anchor="middle">FastAPI backend</text>
<text class="sub sub-blue" x="340" y="247" text-anchor="middle">deployment gate · drift detection · alert</text>

<!-- blocked deploy right -->
<line x1="490" y1="234" x2="540" y2="234" class="arr" marker-end="url(#arrow)"/>
<rect x="542" y="212" width="118" height="44" rx="8" class="box-red"/>
<text class="th txt-red" x="601" y="231" text-anchor="middle">Deployment</text>
<text class="sub sub-red" x="601" y="247" text-anchor="middle">blocked if &lt; 0.75</text>

<line x1="340" y1="262" x2="340" y2="292" class="arr" marker-end="url(#arrow)"/>

<!-- Row 3: PostgreSQL -->
<rect x="190" y="292" width="300" height="56" rx="8" class="box-teal"/>
<text class="th txt-teal" x="340" y="315" text-anchor="middle">PostgreSQL</text>
<text class="sub sub-teal" x="340" y="333" text-anchor="middle">historical scores · model versions · timestamps</text>

<line x1="340" y1="348" x2="340" y2="378" class="arr" marker-end="url(#arrow)"/>

<!-- Row 4: Grafana -->
<rect x="190" y="378" width="300" height="56" rx="8" class="box-green"/>
<text class="th txt-green" x="340" y="401" text-anchor="middle">Grafana dashboard</text>
<text class="sub sub-green" x="340" y="419" text-anchor="middle">polls /evals/summary/latest every 30s</text>

<line x1="340" y1="434" x2="340" y2="464" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="464" x2="190" y2="464" class="arr"/>
<line x1="340" y1="464" x2="490" y2="464" class="arr"/>

<!-- Row 5: Panels -->
<rect x="100" y="464" width="170" height="56" rx="8" class="box-gray"/>
<text class="th txt-gray" x="185" y="487" text-anchor="middle">Time-series panel</text>
<text class="sub sub-gray" x="185" y="503" text-anchor="middle">score trends over runs</text>

<rect x="410" y="464" width="170" height="56" rx="8" class="box-gray"/>
<text class="th txt-gray" x="495" y="487" text-anchor="middle">Drift alert panel</text>
<text class="sub sub-gray" x="495" y="503" text-anchor="middle">0.91→0.73 spike visible</text>

</svg>
